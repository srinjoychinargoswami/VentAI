name: vent_ai
description: "A Privacy-First Offline Emotional Support Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Dependencies
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0

  # Core Dependencies
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  dio: ^5.4.0
  url_launcher: ^6.1.0

  # AI & ML Dependencies — ANDROID & DESKTOP
  # Modular engines ONLY (no base flutter_gemma = no large_file_handler v1 embedding!)
  flutter_gemma: ^1.5.9
  flutter_gemma_litertlm: ^1.4.2

  # Database Dependencies
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  path: ^1.8.3
  crypto: ^3.0.0
  encrypt: ^5.0.0

  # Utilities
  convert: ^3.1.1
  collection: ^1.17.2
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Windows Distribution
  msix: ^3.16.10

  # Code Quality & Generation
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  # Asset Declarations
 