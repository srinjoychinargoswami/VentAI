name: vent_ai
description: "A Privacy-First Offline Emotional Support Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Dependencies
  cupertino_icons: ^1.0.8
  google_fonts: ^5.1.0
  flutter_svg: ^2.1.0

  # Core Dependencies
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  dio: ^5.4.0

  # AI & ML Dependencies — ANDROID ONLY
  device_info_plus: ^9.1.0
  flutter_gemma: ^1.1.2

  # Database Dependencies
  drift: ^2.12.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.3

  # Utilities
  convert: ^3.1.1
  collection: ^1.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Windows Distribution
  msix: ^3.16.10

  # Code Quality & Generation
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  drift_dev: ^2.12.1

flutter:
  uses-material-design: true

  # Asset Declarations
  assets:
    - assets/runtime/